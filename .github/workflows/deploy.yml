name: Deploy to GitHub Pages

# Production deployment. Runs ONLY on push to main (i.e. the cutover merge) or a
# manual dispatch. Building the new Work/Pay site and serving it from
# tinytools.live is this workflow's job; until main is updated the old site keeps
# serving.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure GitHub Pages (switches source to "GitHub Actions")
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

      - name: Verify build artefacts
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          test "$(cat dist/CNAME)" = "tinytools.live"
          test -f dist/sitemap-index.xml
          test -f dist/robots.txt
          test -f dist/404.html
          test -f dist/ads.txt
          echo "Pages: $(find dist -name '*.html' | wc -l)  CNAME: $(cat dist/CNAME)"

      - name: SEO crawl gate
        run: npm run qa:seo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
