name: Deploy Astro site to GitHub Pages

# The ONLY workflow that deploys this site. Manual trigger only, so it can be run
# from redesign/work-pay to validate the live site before the main cutover
# (instruction: main must stay the rollback version until validation passes).
#
# This does NOT use Jekyll. GitHub's built-in "pages-build-deployment"
# (actions/jekyll-build-pages) only runs while Pages Source = "Deploy from a
# branch". The `configure-pages` step below switches Source to "GitHub Actions",
# which disables that legacy builder. If that step lacks permission in your org,
# set it manually: repo Settings -> Pages -> Build and deployment -> Source ->
# "GitHub Actions".
#
# At cutover, either re-run this workflow with --ref main, or add a
# `push: { branches: [main] }` trigger.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure GitHub Pages (Source -> "GitHub Actions", disables Jekyll builder)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Tests (engine + islands)
        run: npm test
      - name: Astro build (outputs dist/)
        run: npm run build

      - name: Verify Astro dist/ artefacts (not repo root, not Jekyll)
        run: |
          test -f dist/index.html
          test -f dist/.nojekyll
          test -f dist/CNAME
          test "$(cat dist/CNAME)" = "tinytools.live"
          test -f dist/sitemap-index.xml
          test -f dist/robots.txt
          test -f dist/404.html
          test -f dist/ads.txt
          test -d dist/_astro
          test ! -f dist/package.json   # confirms we ship the build, not the source tree
          echo "HTML pages: $(find dist -name '*.html' | wc -l)  CNAME: $(cat dist/CNAME)"

      - name: SEO crawl gate
        run: npm run qa:seo

      - name: Upload the dist/ directory as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the uploaded artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
